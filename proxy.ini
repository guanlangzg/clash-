; DNS 防泄露与多分流规则
; 目标：Subconverter + Mihomo（Clash.Meta）
; 规则源使用 jsDelivr GitHub CDN 镜像；生成后仍需用目标内核校验

; ========== 1. 基础直连与白名单 ==========
ruleset=🎯 全球直连,[]IP-CIDR,5.5.5.5/32
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/LocalAreaNetwork.list
