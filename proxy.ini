; ========== 9. 漏网之鱼 ==========
; 未匹配流量与未单列的海外服务共用此组，不再增加“节点选择”或“手动切换”。
ruleset=🐟 漏网之鱼,[]FINAL

; ================================================================
;                         策略组配置
; ================================================================

; ---------- 全节点选择与自动入口 ----------
; .* 全选转换器实际导入的节点，不依赖供应商名称；订阅公告若伪装为节点也会被包含。
; 各业务组可独立手选节点或引用唯一自动组，不再新增地区、协议或“手动”副本。
; AI / TikTok / 国外媒体 / 奈飞默认首个节点；油管 / 漏网默认自动；微软默认 DIRECT。
; 600 秒、150 毫秒容差是偏稳定的起点；测速不证明带宽、地区或业务解锁能力。
; 固定节点不保证供应商出口 IP 固定；Cloudflare 排查需同条件对照，不按 CDN 标签定因。
custom_proxy_group=🤖 AI服务`select`.*`[]♻️ 自动选择
custom_proxy_group=📹 油管视频`select`[]♻️ 自动选择`.*
custom_proxy_group=🎵 TikTok`select`.*`[]♻️ 自动选择
custom_proxy_group=🌍 国外媒体`select`.*`[]♻️ 自动选择
custom_proxy_group=🎥 奈飞视频`select`.*`[]♻️ 自动选择
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]♻️ 自动选择`.*
custom_proxy_group=🐟 漏网之鱼`select`[]♻️ 自动选择`.*`[]DIRECT
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`600,,150

enable_rule_generator=true
overwrite_original_rules=true
