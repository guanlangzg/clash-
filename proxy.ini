; Family prefixes classify names only; CDN and non-CDN entries may share an exit.
custom_proxy_group=cdn节点`url-test`^(?:isus|hyhk|xzhk|ccus)-.*cdn$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇭🇰 香港节点`url-test`^(?:hyhk|xzhk)-`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇲 美国节点`url-test`^(?:isus|ccus)-`https://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
