; ========== 9. 最终兜底 ==========
ruleset=🐟 漏网之鱼,[]FINAL

; ---------- 全节点选择与自动入口 ----------
; .* 全选实际导入的具名节点；手动首节点不代表出口地区或解锁能力已验证。
; 600 秒间隔、150 毫秒容差；共享挑战域与各业务组可由用户核对并手选同一出口。
custom_proxy_group=🤖 AI服务`select`.*`[]♻️ 自动选择
custom_proxy_group=💬 社区论坛`select`.*`[]♻️ 自动选择
