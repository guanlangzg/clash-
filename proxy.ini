ruleset=🐟 漏网之鱼,[]FINAL

; ================================================================
;                         策略组配置
; ================================================================

; Node filters target the current four families; review them when names change.
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🚀 全部节点`[]🚀 手动切换1`[]🚀 手动切换2`[]🚀 手动切换3`[]🛡️ 故障转移`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]cdn节点`[]DIRECT
custom_proxy_group=🚀 全部节点`select`^(?:isus|hyhk|xzhk|ccus)-
custom_proxy_group=🚀 手动切换1`select`^(?:isus|hyhk|xzhk|ccus)-
custom_proxy_group=🚀 手动切换2`select`^(?:isus|hyhk|xzhk|ccus)-
custom_proxy_group=🚀 手动切换3`select`^(?:isus|hyhk|xzhk|ccus)-
custom_proxy_group=♻️ 自动选择`url-test`^(?:isus|hyhk|xzhk|ccus)-`https://www.gstatic.com/generate_204`300,,50
; Fallback follows subscription order, not a presumed CDN or regional preference.
custom_proxy_group=🛡️ 故障转移`fallback`^(?:isus|hyhk|xzhk|ccus)-`https://www.gstatic.com/generate_204`300

; Direct node candidates keep each service independent of shared group selections.
; Names and health checks do not establish exit region or service availability.
custom_proxy_group=🤖 OpenAI`select`^(?:isus|ccus)-`^(?:hyhk|xzhk)-
custom_proxy_group=🎥 奈飞视频`select`^(?:isus|ccus)-`^(?:hyhk|xzhk)-
custom_proxy_group=🎵 TikTok`select`^(?:isus|ccus)-`^(?:hyhk|xzhk)-

custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`^(?:isus|hyhk|xzhk|ccus)-`[]DIRECT
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`^(?:isus|hyhk|xzhk|ccus)-`[]DIRECT
custom_proxy_group=📺 巴哈姆特`select`[]🚀 节点选择`^(?:isus|hyhk|xzhk|ccus)-`[]DIRECT
custom_proxy_group=📺 哔哩哔哩`select`[]🎯 全球直连`[]🇭🇰 香港节点
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`^(?:isus|hyhk|xzhk|ccus)-`[]DIRECT
custom_proxy_group=🌏 国内媒体`select`[]DIRECT`^(?:isus|hyhk|xzhk|ccus)-
custom_proxy_group=📢 谷歌FCM`select`[]DIRECT`[]🚀 节点选择`^(?:isus|hyhk|xzhk|ccus)-
custom_proxy_group=Ⓜ️ 微软云盘`select`[]DIRECT`[]🚀 节点选择`^(?:isus|hyhk|xzhk|ccus)-
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`^(?:isus|hyhk|xzhk|ccus)-
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`^(?:isus|hyhk|xzhk|ccus)-
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🚀 节点选择`^(?:isus|hyhk|xzhk|ccus)-
custom_proxy_group=🎶 网易音乐`select`[]DIRECT`[]🚀 节点选择`^(?:isus|hyhk|xzhk|ccus)-
