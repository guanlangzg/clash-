ruleset=📲 电报消息,[]IP-CIDR,91.105.192.0/23,no-resolve
ruleset=📲 电报消息,[]IP-CIDR,185.76.151.0/24,no-resolve
ruleset=📲 电报消息,[]IP-CIDR,5.28.192.0/18,no-resolve
ruleset=📲 电报消息,[]IP-CIDR6,2001:b28:f23c::/48,no-resolve
ruleset=📲 电报消息,[]IP-CIDR6,2a0a:f280::/32,no-resolve
ruleset=📲 电报消息,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Telegram.list
