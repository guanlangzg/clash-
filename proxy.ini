[custom]
; 十个业务手动组 + 一个自动入口；仅适用于 Subconverter + Mihomo（Clash.Meta）。
; DOMAIN-REGEX 用于合并同策略域名，外部配置控制在默认的 64 条 ruleset 指令以内。
; 远程列表按转换时的快照展开；更新上游后仍需重新转换并更新客户端配置。

; ========== 1. 局域网与必要业务白名单 ==========
ruleset=DIRECT,[]IP-CIDR,5.5.5.5/32,no-resolve
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/LocalAreaNetwork.list
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/UnBan.list
; 只放行隐私页面、静态资源与已确认被关键词误伤的正常站点；京东广告子域仍由后续规则拦截。
ruleset=DIRECT,[]DOMAIN-REGEX,^(policy\.jd\.com|wxsnsdy\.wxs\.qq\.com|wxsnsdythumb\.wxs\.qq\.com|img1\.126\.net|img2\.126\.net|mimg\.126\.net)$
ruleset=DIRECT,[]DOMAIN-REGEX,(^|\.)(openxlab\.org\.cn|openxmlformats\.org)$

; ========== 2. 广告域名拦截 ==========
; 白名单之外直接 REJECT；同域广告与正文无法通过域名规则区分。
ruleset=REJECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanAD.list
ruleset=REJECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanProgramAD.list
ruleset=REJECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanEasyListChina.list

; ========== 3. AI 专属分流 ==========
; 仅列产品自有域与专用主机；不将共享 auth0、Stripe、遥测域或整个云服务 ASN 归入 AI。
ruleset=🤖 AI服务,[]DOMAIN-REGEX,(^|\.)(openai\.com|chatgpt\.com|oaistatic\.com|oaiusercontent\.com|sora\.com|anthropic\.com|claude\.ai|claude\.com|githubcopilot\.com|perplexity\.ai|x\.ai|grok\.com)$
ruleset=🤖 AI服务,[]DOMAIN-REGEX,^(aistudio\.google\.com|makersuite\.google\.com|gemini\.google\.com|generativelanguage\.googleapis\.com|copilot-proxy\.githubusercontent\.com|copilot\.microsoft\.com|copilot\.cloud\.microsoft|sydney\.bing\.com|chat\.openai\.com\.cdn\.cloudflare\.net|openai-api\.arkoselabs\.com|openaicom-api-bdcpf8c6d2e9atf6\.z01\.azurefd\.net|openaicomproductionae4b\.blob\.core\.windows\.net|production-openaicom-storage\.azureedge\.net|openaiapi-site\.azureedge\.net|openaicom\.imgix\.net)$

; ========== 4. 视频专用规则 ==========
ruleset=📹 油管视频,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/YouTube.list
ruleset=🎵 TikTok,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/TikTok.list
ruleset=🎥 奈飞视频,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Netflix.list
ruleset=🌍 国外媒体,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/Bahamut.list

; ========== 5. 国内媒体与苹果服务 ==========
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/Ruleset/BilibiliHMT.list
