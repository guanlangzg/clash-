; ================================================================
;                         策略组配置
; ================================================================

; ---------- 家族前缀约定 ----------
; 节点名以家族前缀开头：isus-/ccus- 属美国，hyhk-/xzhk- 属香港，NL- 属荷兰，
; cheaphost-日本-/绿云 IIJ-日本- 属日本，三网优化SG伪家宽- 属新加坡（家宽）。
; 所有节点级选择器统一写成 ^(?:族1|族2|...)- 整体锚定前缀，不用裸子串匹配，
; 以免误命中 isusx-test、other-hk-cdn 这类无关名称。
;
; ---------- 自动组与手动孪生组 ----------
; 每个自动组（url-test / fallback）都有一个选择器逐字相同、类型为 select 的
; “-手动”孪生组；自动组按延迟/可用性选点，孪生组用于手工钉住同一候选集合。
;
; ---------- 待补 ----------
; 第 14 条节点（vless，订阅中无显示名）暂无可用的家族前缀，
; 待其显示名确定并补上前缀后，才会被上述节点级组接管。
