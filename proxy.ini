[custom]
; 七个独立业务组 + 一个自动选择入口；国内服务固定直连
; 目标：Subconverter + Mihomo（Clash.Meta），本文件不是可直接导入的 YAML
; 规则源使用 jsDelivr 镜像；完整转换、内核与业务效果需分别验证

; ========== 1. 基础直连与京东白名单 ==========
ruleset=DIRECT,[]IP-CIDR,5.5.5.5/32
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/LocalAreaNetwork.list
ruleset=DIRECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/UnBan.list
ruleset=DIRECT,[]DOMAIN-SUFFIX,jd.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,360buy.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,360buyimg.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,jdcloud.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,jdpay.com
ruleset=DIRECT,[]DOMAIN-SUFFIX,jcloudcs.com

; ========== 2. 广告拦截 ==========
; 单一 classical 规则源，直接使用内置 REJECT，不额外创建策略组。
ruleset=REJECT,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanProgramAD.list

; ========== 3. AI 专属分流 ==========
; 专用规则必须先于微软和通用海外规则；通用认证、支付与 Cloudflare 挑战域不强制归入 AI。
